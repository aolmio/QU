<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ECDSA QR Verifier</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7f5;--card:#fff;--card2:#eef3ef;--text:#14201a;--muted:#5b6b62;--accent:#2f9e63;--accent-text:#fff;--border:#cfdcd3;--ok:#1a8f4f;--okbg:#dff5e8;--bad:#c0392b;--badbg:#fbe4e1;--warn:#a6700a;--warnbg:#fdf0d2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1210;--card:#18211d;--card2:#212c27;--text:#e8f1ec;--muted:#92a49a;--accent:#72c48d;--accent-text:#0b1a12;--border:#2c4a3b;--ok:#72c48d;--okbg:#18372a;--bad:#ff8a7a;--badbg:#3a1d1a;--warn:#f0c15a;--warnbg:#3a2f12}}
:root[data-theme="dark"]{--bg:#0d1210;--card:#18211d;--card2:#212c27;--text:#e8f1ec;--muted:#92a49a;--accent:#72c48d;--accent-text:#0b1a12;--border:#2c4a3b;--ok:#72c48d;--okbg:#18372a;--bad:#ff8a7a;--badbg:#3a1d1a;--warn:#f0c15a;--warnbg:#3a2f12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:19px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
.tabs{display:flex;gap:6px;background:var(--card2);padding:5px;border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);padding:10px;border-radius:10px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--accent);color:var(--accent-text)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button.b,label.b{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-text);padding:11px 14px;border-radius:12px;font:600 14px inherit;font-family:inherit;cursor:pointer;flex:1;min-width:120px;text-align:center}
button.b.o,label.b.o{background:none;color:var(--accent)}
button.b.d{border-color:var(--bad);color:var(--bad);background:none;flex:0;min-width:0;padding:7px 11px}
input[type=text],textarea{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px;font:13px ui-monospace,Menlo,Consolas,monospace;margin-bottom:8px}
input[type=text]{font-family:inherit;font-size:15px}
textarea{min-height:120px;resize:vertical}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.vid{position:relative;border-radius:14px;overflow:hidden;background:#000;display:none;margin-bottom:10px;aspect-ratio:1/1}
.vid video{width:100%;height:100%;object-fit:cover}
.vid i{position:absolute;inset:18%;border:3px solid #72c48d;border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.drop{border:2px dashed var(--border);border-radius:14px;padding:16px;text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.drop.h{border-color:var(--accent);color:var(--accent)}
.msg{font-size:13px;color:var(--muted);margin-top:8px;min-height:18px}
.res{border-radius:16px;padding:16px;margin-bottom:14px;display:none}
.res.ok{background:var(--okbg);color:var(--ok);border:1px solid var(--ok)}
.res.bad{background:var(--badbg);color:var(--bad);border:1px solid var(--bad)}
.res.warn{background:var(--warnbg);color:var(--warn);border:1px solid var(--warn)}
.res h2{margin:0 0 4px;font-size:20px}
.res p{margin:0;font-size:13px;color:var(--text)}
.lbl{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 4px}
pre{margin:0;background:var(--card2);color:var(--text);border-radius:12px;padding:12px;font:12.5px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow:auto}
.key{border:1px solid var(--border);border-radius:12px;padding:10px;margin-bottom:8px;background:var(--card2)}
.key .t{display:flex;justify-content:space-between;align-items:center;gap:8px}
.key b{word-break:break-word}
.fp{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--accent);margin-top:2px}
.key details{margin-top:6px;font-size:12px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:12px;font-size:13px}
.hid{display:none}
canvas{display:none}
</style>
</head>
<body>
<main>
<h1>ECDSA P-256 QR Verifier</h1>
<p class="sub">Offline signature check · keys stay on this device</p>

<div class="tabs">
<button class="on" data-tab="scan">Scan</button>
<button data-tab="keys">Public Keys <span id="kc">(0)</span></button>
</div>

<section id="tab-scan">
<div class="card">
<div class="vid" id="vid"><video id="video" playsinline muted></video><i></i></div>
<div class="row">
<button class="b" id="camBtn">Start Camera</button>
<label class="b o" for="imgIn">Upload Image</label>
<input type="file" id="imgIn" accept="image/*">
</div>
<label class="drop" id="drop" for="imgIn" style="display:block;cursor:pointer">Tap to choose, drop, or paste a QR image here</label>
<div class="msg" id="scanMsg"></div>
<details style="margin-top:8px">
<summary style="cursor:pointer;color:var(--muted);font-size:13px">Verify pasted QR text</summary>
<textarea id="manual" placeholder="Paste QR text content" style="margin-top:8px"></textarea>
<button class="b o" id="manualBtn" style="width:100%">Verify Text</button>
</details>
</div>

<div class="res" id="res">
<h2 id="resTitle"></h2>
<p id="resSub"></p>
</div>

<div class="card hid" id="detail">
<div class="lbl" style="margin-top:0">Decoded content</div>
<pre id="content"></pre>
<div class="lbl">Matched key</div>
<pre id="matched"></pre>
<div class="lbl">Raw QR text</div>
<pre id="raw"></pre>
</div>
</section>

<section id="tab-keys" class="hid">
<div class="card">
<div class="lbl" style="margin-top:0">Add public key</div>
<input type="text" id="kname" placeholder="Key name (e.g. Shop A issuer)">
<textarea id="kpem" placeholder="-----BEGIN PUBLIC KEY-----&#10;...&#10;-----END PUBLIC KEY-----"></textarea>
<div class="row">
<button class="b" id="addKey">Save Key</button>
<label class="b o" for="pemFile">Load .pem File</label>
<input type="file" id="pemFile" accept=".pem,.txt,.pub,.key,text/plain">
</div>
<div class="msg" id="keyMsg"></div>
</div>

<div class="card">
<div class="lbl" style="margin-top:0">Stored keys</div>
<div id="keyList"></div>
</div>

<div class="card">
<div class="lbl" style="margin-top:0">Export / Import all keys</div>
<textarea id="exp" placeholder="Exported keys JSON appears here. Paste a backup here to import."></textarea>
<div class="row">
<button class="b" id="expBtn">Export All</button>
<button class="b o" id="copyBtn">Copy</button>
<button class="b o" id="impBtn">Import From Text</button>
<label class="b o" for="jsonFile">Import File</label>
<input type="file" id="jsonFile" accept=".json,application/json,text/plain">
</div>
<div class="msg" id="expMsg"></div>
</div>
</section>
</main>
<canvas id="cv"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const enc=new TextEncoder();
const STORE='ecdsa_pub_keys_v1';
let mem=[];
let keys=loadKeys();
const cache=new Map();
let stream=null;

function loadKeys(){
  try{const v=localStorage.getItem(STORE);if(v){const a=JSON.parse(v);if(Array.isArray(a))return a}}catch(e){}
  return mem.slice();
}
function saveKeys(){
  mem=keys.slice();
  try{localStorage.setItem(STORE,JSON.stringify(keys))}catch(e){}
}

function hex(b){return Array.from(b,x=>x.toString(16).padStart(2,'0')).join('').toUpperCase()}
function strictB64(s){
  if(typeof s!=='string')return null;
  s=s.replace(/\s+/g,'');
  if(s.length<4||!/^[A-Za-z0-9+/_-]+={0,2}$/.test(s))return null;
  s=s.replace(/-/g,'+').replace(/_/g,'/').replace(/=+$/,'');
  if(s.length%4===1)return null;
  s+='='.repeat((4-s.length%4)%4);
  try{const bin=atob(s);const out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}catch(e){return null}
}
function utf8(b){
  try{const t=new TextDecoder('utf-8',{fatal:true}).decode(b);return /[\x00-\x08\x0b\x0c\x0e-\x1f]/.test(t)?null:t}catch(e){return null}
}
function hexBytes(s){
  s=s.trim();
  if(s.length<128||s.length%2||!/^[0-9a-fA-F]+$/.test(s))return null;
  const o=new Uint8Array(s.length/2);
  for(let i=0;i<o.length;i++)o[i]=parseInt(s.substr(i*2,2),16);
  return o;
}
function derToRaw(b){
  if(b.length<8||b.length>80||b[0]!==0x30)return null;
  let i=2;
  if(b[1]&0x80)i=2+(b[1]&0x7f);
  if(b[i]!==2)return null;
  const rl=b[i+1];let r=b.slice(i+2,i+2+rl);i+=2+rl;
  if(b[i]!==2)return null;
  const sl=b[i+1];let s=b.slice(i+2,i+2+sl);
  while(r.length>32&&r[0]===0)r=r.slice(1);
  while(s.length>32&&s[0]===0)s=s.slice(1);
  if(r.length>32||s.length>32||!r.length||!s.length)return null;
  const o=new Uint8Array(64);
  o.set(r,32-r.length);o.set(s,64-s.length);
  return o;
}
function decodeSig(v){
  if(typeof v!=='string')return null;
  const b=hexBytes(v)||strictB64(v);
  if(!b)return null;
  if(b.length===64)return b;
  return derToRaw(b);
}
function pretty(s){
  let t=s;
  const b=strictB64(s);
  if(b&&s.replace(/\s+/g,'').length>=16){const d=utf8(b);if(d!==null)t=d}
  try{const j=JSON.parse(t);if(j&&typeof j==='object')return JSON.stringify(j,null,2)}catch(e){}
  return t;
}
function msgsFor(s){
  const a=[enc.encode(s)];
  const b=strictB64(s);
  if(b&&s.length>=8)a.push(b);
  return a;
}
function sortObj(o){
  if(Array.isArray(o))return o.map(sortObj);
  if(o&&typeof o==='object'){const r={};Object.keys(o).sort().forEach(k=>r[k]=sortObj(o[k]));return r}
  return o;
}
const SIGK=['sig','signature','s','sign','sg'];
const PAYK=['data','payload','p','d','msg','message','content'];

function parse(text,depth){
  const out=[];
  const t=text.trim();
  try{
    const obj=JSON.parse(t);
    if(obj&&typeof obj==='object'&&!Array.isArray(obj)){
      const sk=SIGK.find(k=>k in obj);
      const sig=sk?decodeSig(obj[sk]):null;
      if(sig){
        const pk=PAYK.find(k=>k in obj);
        if(pk){
          const pv=obj[pk];
          if(typeof pv==='string'){
            out.push({sig,msgs:msgsFor(pv),content:pretty(pv)});
          }else{
            out.push({sig,msgs:[enc.encode(JSON.stringify(pv)),enc.encode(JSON.stringify(sortObj(pv)))],content:JSON.stringify(pv,null,2)});
          }
        }
        const rest={...obj};delete rest[sk];
        out.push({sig,msgs:[enc.encode(JSON.stringify(rest)),enc.encode(JSON.stringify(sortObj(rest)))],content:JSON.stringify(rest,null,2)});
      }
    }
  }catch(e){}
  for(const d of ['.','|','~','\n',':',',',';']){
    const parts=t.split(d);
    if(parts.length<2)continue;
    const sig=decodeSig(parts[parts.length-1]);
    if(!sig)continue;
    const body=parts.slice(0,-1);
    const joined=body.join(d);
    let content=pretty(joined);
    if(d==='.'&&parts.length===3)content=pretty(parts[1]);
    out.push({sig,msgs:msgsFor(joined),content});
  }
  const mt=t.match(/[A-Za-z0-9+\/_=-]{86,200}$|[0-9a-fA-F]{128,}$/);
  if(mt){
    const sg=decodeSig(mt[0]);
    if(sg){
      const head=t.slice(0,mt.index);
      const trimmed=head.replace(/[\s.|~:,;]+$/,'');
      out.push({sig:sg,msgs:[...msgsFor(trimmed),enc.encode(head)],content:pretty(trimmed)});
    }
  }
  const ja=t.indexOf('{'),jz=t.lastIndexOf('}');
  if(depth<1&&ja>=0&&jz>ja&&(ja>0||jz<t.length-1))out.push(...parse(t.slice(ja,jz+1),depth+1));
  if(depth<1){
    const b=strictB64(t);
    if(b&&t.length>=16){
      const d=utf8(b);
      if(d!==null)out.push(...parse(d,depth+1));
      if(b.length>64){
        out.push({sig:b.slice(-64),msgs:[b.slice(0,-64)],content:utf8(b.slice(0,-64))??('[binary '+(b.length-64)+' bytes]')});
        const der=derToRaw(b.slice(-72))||derToRaw(b.slice(-71))||derToRaw(b.slice(-70));
        if(der){
          for(const n of [72,71,70]){const r=derToRaw(b.slice(-n));if(r&&b[b.length-n]===0x30){out.push({sig:r,msgs:[b.slice(0,-n)],content:utf8(b.slice(0,-n))??'[binary]'});break}}
        }
      }
    }
  }
  return out;
}

function pemToDer(pem){
  const body=pem.replace(/-----[^-]+-----/g,'').replace(/\s+/g,'');
  return strictB64(body);
}
async function importPub(der){
  if(der.length===65&&der[0]===4)return crypto.subtle.importKey('raw',der,{name:'ECDSA',namedCurve:'P-256'},true,['verify']);
  return crypto.subtle.importKey('spki',der,{name:'ECDSA',namedCurve:'P-256'},true,['verify']);
}
async function fingerprint(der){
  const h=new Uint8Array(await crypto.subtle.digest('SHA-256',der));
  return Array.from(h.slice(0,8),x=>x.toString(16).padStart(2,'0').toUpperCase()).join(':');
}
async function keyObj(k){
  if(cache.has(k.id))return cache.get(k.id);
  const der=pemToDer(k.pem);
  const ck=await importPub(der);
  cache.set(k.id,ck);
  return ck;
}
function toPem(der){
  let s='';for(const x of der)s+=String.fromCharCode(x);
  const b=btoa(s).match(/.{1,64}/g).join('\n');
  return '-----BEGIN PUBLIC KEY-----\n'+b+'\n-----END PUBLIC KEY-----';
}

async function addKeyFrom(name,pem){
  const der0=pemToDer(pem);
  if(!der0)throw new Error('Could not read key. Paste a PEM or Base64 public key.');
  let ck;
  try{ck=await importPub(der0)}catch(e){throw new Error('Not a valid ECDSA P-256 public key.')}
  let spki=der0;
  if(der0.length===65){spki=new Uint8Array(await crypto.subtle.exportKey('spki',ck))}
  const fp=await fingerprint(spki);
  const pemNorm=toPem(spki);
  if(keys.some(k=>k.pem===pemNorm))throw new Error('This key is already stored.');
  const k={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),name:name||('Key '+(keys.length+1)),pem:pemNorm,fp,added:new Date().toISOString()};
  keys.push(k);cache.set(k.id,ck);saveKeys();
  return k;
}

function renderKeys(){
  $('kc').textContent='('+keys.length+')';
  const box=$('keyList');box.textContent='';
  if(!keys.length){const e=document.createElement('div');e.className='empty';e.textContent='No public keys stored yet.';box.appendChild(e);return}
  keys.forEach(k=>{
    const d=document.createElement('div');d.className='key';
    const t=document.createElement('div');t.className='t';
    const b=document.createElement('b');b.textContent=k.name;
    const x=document.createElement('button');x.className='b d';x.textContent='Delete';
    x.onclick=()=>{if(confirm('Delete "'+k.name+'"?')){keys=keys.filter(z=>z.id!==k.id);cache.delete(k.id);saveKeys();renderKeys()}};
    t.append(b,x);
    const f=document.createElement('div');f.className='fp';f.textContent=k.fp;
    const det=document.createElement('details');
    const sm=document.createElement('summary');sm.textContent='Show PEM';sm.style.cursor='pointer';
    const pr=document.createElement('pre');pr.textContent=k.pem;
    det.append(sm,pr);
    d.append(t,f,det);box.appendChild(d);
  });
}

const B45='0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ $%*+-./:';
function b45(s){
  const o=[];
  for(let i=0;i<s.length;i+=3){
    const c=s.slice(i,i+3).split('').map(x=>B45.indexOf(x));
    if(c.some(x=>x<0))return null;
    if(c.length===3){const v=c[0]+c[1]*45+c[2]*2025;if(v>65535)return null;o.push(v>>8,v&255)}
    else if(c.length===2){const v=c[0]+c[1]*45;if(v>255)return null;o.push(v)}
    else return null;
  }
  return new Uint8Array(o);
}
async function inflateRaw(u){
  const ds=new DecompressionStream('deflate-raw');
  const w=ds.writable.getWriter();w.write(u);w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}
function readSV(d){
  const dec=x=>Array.from(x,c=>c>=0x80?String.fromCharCode(0x1000+c-0x80):String.fromCharCode(c)).join('');
  const out=[];const rest=[];let i=0;
  while(i<d.length){
    const n=d[i];
    if(n>=1&&n<=80&&i+1+n<=d.length){
      const s=d.slice(i+1,i+1+n);
      if(s.every(c=>c>=0x20)){out.push(dec(s));i+=1+n;continue}
    }
    rest.push(d[i].toString(16).padStart(2,'0'));i++;
  }
  return out.join('\n')+(rest.length?'\n\n[other bytes] '+rest.join(' '):'');
}
async function verifySV2(text){
  const t=text.trim();
  if(!/^SV\d+:/.test(t))return null;
  const b=b45(t.replace(/^SV\d+:/,''));
  if(!b||b.length<70)return null;
  const len=(b[2]<<8)|b[3];
  const pay=b.slice(4,4+len);
  const sig=b.slice(4+len);
  let d=pay;
  if(b[1]&1){try{d=await inflateRaw(pay)}catch(e){return null}}
  const res={status:'',key:null,content:readSV(d)};
  if(!keys.length){res.status='nokeys';return res}
  const sg=sig.length===64?sig:derToRaw(sig);
  if(sg){
    for(const k of keys){
      let ck;try{ck=await keyObj(k)}catch(e){continue}
      for(const m of [d,pay,b.slice(0,4+len)]){
        try{if(await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},ck,sg,m)){res.status='ok';res.key=k;return res}}catch(e){}
      }
    }
  }
  res.status='bad';res.tried=keys.length;
  return res;
}
async function verify(text){
  const sv=await verifySV2(text);
  if(sv)return sv;
  const cands=parse(text,0);
  const res={status:'',key:null,content:pretty(text)};
  if(!cands.length){res.status='nosig';return res}
  res.content=cands[0].content;
  if(!keys.length){res.status='nokeys';return res}
  for(const k of keys){
    let ck;
    try{ck=await keyObj(k)}catch(e){continue}
    for(const c of cands){
      for(const m of c.msgs){
        for(const h of ['SHA-256','SHA-384','SHA-512']){
          try{
            const ok=await crypto.subtle.verify({name:'ECDSA',hash:h},ck,c.sig,m);
            if(ok){res.status='ok';res.key=k;res.content=c.content;return res}
          }catch(e){}
        }
      }
    }
  }
  res.status='bad';
  res.tried=keys.length;
  return res;
}

function showResult(text,r){
  const el=$('res');
  el.style.display='block';
  const map={
    ok:['ok','✔ AUTHENTIC','Signature verified with stored public key “'+(r.key&&r.key.name)+'”.'],
    bad:['bad','✘ NOT AUTHENTIC','The signature does not match any stored public key. The content may be forged or altered.'],
    nosig:['bad','✘ NOT AUTHENTIC','No recognizable ECDSA signature was found in this QR code.'],
    nokeys:['warn','⚠ CANNOT VERIFY','No public keys stored. Add the issuer public key in the Public Keys tab.']
  };
  const m=map[r.status];
  el.className='res '+m[0];el.style.display='block';
  $('resTitle').textContent=m[1];
  $('resSub').textContent=m[2]+(r.tried?' Tried '+r.tried+' stored key(s).':'');
  $('detail').classList.remove('hid');
  $('content').textContent=r.content;
  $('matched').textContent=r.key?(r.key.name+'\n'+r.key.fp):'None';
  $('raw').textContent=text;
  el.scrollIntoView({behavior:'smooth',block:'nearest'});
}
async function handle(text){
  $('scanMsg').textContent='QR detected. Verifying…';
  try{showResult(text,await verify(text));$('scanMsg').textContent='Done.'}
  catch(e){$('scanMsg').textContent='Verification error: '+e.message}
}

const cv=$('cv'),cx=cv.getContext('2d',{willReadFrequently:true});
let bd=null;
try{if('BarcodeDetector' in window)bd=new BarcodeDetector({formats:['qr_code']})}catch(e){bd=null}
async function detect(){
  if(bd){try{const r=await bd.detect(cv);if(r.length&&r[0].rawValue)return r[0].rawValue}catch(e){}}
  if(window.jsQR){
    const img=cx.getImageData(0,0,cv.width,cv.height);
    const r=jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});
    if(r&&r.data)return r.data;
  }
  return null;
}
async function decodeImage(src){
  const img=new Image();
  await new Promise((ok,no)=>{img.onload=ok;img.onerror=()=>no(new Error('Image could not be loaded'));img.src=src});
  for(const max of [1600,1000,600,2400]){
    const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    cv.width=Math.max(1,Math.round(img.naturalWidth*sc));
    cv.height=Math.max(1,Math.round(img.naturalHeight*sc));
    cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
    cx.drawImage(img,0,0,cv.width,cv.height);
    const r=await detect();
    if(r)return r;
  }
  return null;
}
async function fromFile(f){
  if(!f)return;
  $('scanMsg').textContent='Reading image…';
  const url=URL.createObjectURL(f);
  try{
    const t=await decodeImage(url);
    if(t)await handle(t);else $('scanMsg').textContent='No QR code found in this image.';
  }catch(e){$('scanMsg').textContent=e.message}
  URL.revokeObjectURL(url);
}

async function startCam(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
  }catch(e){
    $('scanMsg').textContent='Camera unavailable: '+e.message+'. Use Upload Image instead.';
    return;
  }
  const v=$('video');v.srcObject=stream;await v.play();
  $('vid').style.display='block';
  $('camBtn').textContent='Stop Camera';
  $('scanMsg').textContent='Point the camera at a QR code.';
  tick();
}
function stopCam(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  $('vid').style.display='none';
  $('camBtn').textContent='Start Camera';
}
async function tick(){
  if(!stream)return;
  const v=$('video');
  if(v.readyState>=2&&v.videoWidth){
    const sc=Math.min(1,900/Math.max(v.videoWidth,v.videoHeight));
    cv.width=Math.round(v.videoWidth*sc);cv.height=Math.round(v.videoHeight*sc);
    cx.drawImage(v,0,0,cv.width,cv.height);
    const r=await detect();
    if(r){stopCam();handle(r);return}
  }
  setTimeout(tick,120);
}

$('camBtn').onclick=()=>stream?stopCam():startCam();
$('imgIn').onchange=async e=>{const f=e.target.files[0];try{await fromFile(f)}finally{e.target.value=''}};
$('manualBtn').onclick=()=>{const t=$('manual').value.trim();if(t)handle(t)};
const drop=$('drop');
['dragenter','dragover'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.add('h')}));
['dragleave','drop'].forEach(n=>drop.addEventListener(n,e=>{e.preventDefault();drop.classList.remove('h')}));
['dragover','drop'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener('drop',e=>{const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)fromFile(f)});
document.addEventListener('paste',e=>{
  const items=e.clipboardData&&e.clipboardData.items;
  if(!items)return;
  for(const it of items){if(it.type.startsWith('image/')){fromFile(it.getAsFile());break}}
});

document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  $('tab-scan').classList.toggle('hid',b.dataset.tab!=='scan');
  $('tab-keys').classList.toggle('hid',b.dataset.tab!=='keys');
  if(b.dataset.tab!=='scan')stopCam();
});

function note(id,t,bad){const e=$(id);e.textContent=t;e.style.color=bad?'var(--bad)':'var(--ok)'}
$('addKey').onclick=async()=>{
  try{
    const k=await addKeyFrom($('kname').value.trim(),$('kpem').value);
    $('kname').value='';$('kpem').value='';
    renderKeys();note('keyMsg','Saved “'+k.name+'” ('+k.fp+').');
  }catch(e){note('keyMsg',e.message,true)}
};
$('pemFile').onchange=async e=>{
  const f=e.target.files[0];
  if(!f)return;
  $('kpem').value=await f.text();e.target.value='';
  if(!$('kname').value)$('kname').value=f.name.replace(/\.[^.]+$/,'');
};
$('expBtn').onclick=()=>{
  const data=JSON.stringify({type:'ecdsa-p256-public-keys',version:1,exported:new Date().toISOString(),keys:keys.map(({name,pem,fp,added})=>({name,pem,fp,added}))},null,2);
  $('exp').value=data;
  try{
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
    a.download='public-keys-backup.json';
    document.body.appendChild(a);a.click();a.remove();
  }catch(e){}
  note('expMsg',keys.length+' key(s) exported. Copy the text if no download starts.');
};
$('copyBtn').onclick=async()=>{
  const t=$('exp').value;
  if(!t){note('expMsg','Nothing to copy. Press Export All first.',true);return}
  try{await navigator.clipboard.writeText(t)}catch(e){$('exp').select();document.execCommand('copy')}
  note('expMsg','Copied.');
};
async function importText(t){
  let j;
  try{j=JSON.parse(t)}catch(e){throw new Error('Invalid JSON backup.')}
  const arr=Array.isArray(j)?j:j.keys;
  if(!Array.isArray(arr))throw new Error('No keys found in backup.');
  let n=0,skip=0;
  for(const k of arr){
    try{await addKeyFrom(k.name,k.pem||k.key||'');n++}catch(e){skip++}
  }
  renderKeys();
  note('expMsg','Imported '+n+' key(s), skipped '+skip+' (duplicate or invalid).',n===0&&skip>0);
}
$('impBtn').onclick=async()=>{try{await importText($('exp').value)}catch(e){note('expMsg',e.message,true)}};
$('jsonFile').onchange=async e=>{
  const f=e.target.files[0];
  if(!f)return;
  const t=await f.text();e.target.value='';$('exp').value=t;
  try{await importText(t)}catch(err){note('expMsg',err.message,true)}
};

renderKeys();
if(!window.crypto||!crypto.subtle)$('scanMsg').textContent='Secure context required for signature verification.';
</script>
